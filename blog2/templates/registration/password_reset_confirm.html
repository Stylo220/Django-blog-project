{% extends "parent/base.html" %}
{% load blog2_tags %}
{% block title %}password reset{% endblock %}

{% block content %}
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Change my password" />
        </form>
    {% else %}
        <p>link is not valid!</p>
        <a href="{% url 'blog2:login' %}">login</a>
    {% endif %}
{% endblock %}
