{% extends "parent/base.html" %}

{% block title %}user bio{% endblock %}

{% block content %}
    <div dir="rtl">
        <h2>info of: {{ user.username }} </h2>
   <img src="{{ account.user_photo.url }}" alt="{{ user.username }}" width="200" height="200">
    <p>name: {{ user.first_name }} {{ user.last_name }}</p>
    <p>date of birth: {{ account.date_of_birth }}</p>
    <p>job: {{ account.job }}</p>
    <br>
    <h4>about me: </h4>
    <p>{{ account.bio }}</p>
    </div>


{% endblock %}
